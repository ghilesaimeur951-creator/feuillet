name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Outils de validation des tests (qpdf, poppler, ffmpeg, OpenCV)
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils ffmpeg unzip python3-opencv
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Chromium pour Playwright
        run: bunx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
